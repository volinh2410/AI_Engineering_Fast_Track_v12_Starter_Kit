services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: training
      POSTGRES_PASSWORD: training  # local fixture only; change before any network exposure
      POSTGRES_DB: aibootcamp
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
